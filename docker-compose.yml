services:
  backend:
    build: ./backend
    container_name: meam-backend
    restart: always
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - AUTH_DEFAULT_PASSWORD=${AUTH_DEFAULT_PASSWORD:?AUTH_DEFAULT_PASSWORD must be set in .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - LEGACY_HEADER_AUTH_ENABLED=${LEGACY_HEADER_AUTH_ENABLED:-0}
      - MDAMS_DEMO_MODE=${MDAMS_DEMO_MODE:-0}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-1}
      # Optimize pyvips for low memory environment
      - VIPS_DISC_THRESHOLD=${VIPS_DISC_THRESHOLD}
      - VIPS_CONCURRENCY=${VIPS_CONCURRENCY}
      # Public URLs for IIIF Manifest generation
      # 用于 IIIF Manifest 生成的公共 URL
      - API_PUBLIC_URL=${API_PUBLIC_URL}
      # Backend talks to Cantaloupe internally; clients must use /api/iiif/... proxy routes.
      # 后端通过内部网络访问 Cantaloupe；客户端必须走 /api/iiif/... 代理路由。
      - CANTALOUPE_PUBLIC_URL=${CANTALOUPE_PUBLIC_URL}
      - CANTALOUPE_INTERNAL_URL=${CANTALOUPE_INTERNAL_URL:-http://cantaloupe:8182/iiif/2}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - FACE_RECOGNITION_ENABLED=${FACE_RECOGNITION_ENABLED}
      - FACE_RECOGNITION_PROVIDER=${FACE_RECOGNITION_PROVIDER}
      - FACE_RECOGNITION_BASE_URL=${FACE_RECOGNITION_BASE_URL}
      - FACE_RECOGNITION_TIMEOUT_SECONDS=${FACE_RECOGNITION_TIMEOUT_SECONDS}
      - FACE_RECOGNITION_THRESHOLD=${FACE_RECOGNITION_THRESHOLD}
      - FACE_RECOGNITION_MODEL_ROOT=${FACE_RECOGNITION_MODEL_ROOT}
      - FACE_RECOGNITION_MODEL_NAME=${FACE_RECOGNITION_MODEL_NAME}
      - FACE_RECOGNITION_INDEX_DIR=${FACE_RECOGNITION_INDEX_DIR}
      - FACE_RECOGNITION_STRICT_LOCAL_MODELS=${FACE_RECOGNITION_STRICT_LOCAL_MODELS}
      - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-mdams_search_key}
    volumes:
      # Map NAS mount point directly
      - ${HOST_MUSEUM_PATH}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  celery_worker:
    build: ./backend
    container_name: meam-worker
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # Optimize pyvips for low memory environment
      - VIPS_DISC_THRESHOLD=${VIPS_DISC_THRESHOLD}
      - VIPS_CONCURRENCY=${VIPS_CONCURRENCY}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - FACE_RECOGNITION_ENABLED=${FACE_RECOGNITION_ENABLED}
      - FACE_RECOGNITION_PROVIDER=${FACE_RECOGNITION_PROVIDER}
      - FACE_RECOGNITION_BASE_URL=${FACE_RECOGNITION_BASE_URL}
      - FACE_RECOGNITION_TIMEOUT_SECONDS=${FACE_RECOGNITION_TIMEOUT_SECONDS}
      - FACE_RECOGNITION_THRESHOLD=${FACE_RECOGNITION_THRESHOLD}
      - FACE_RECOGNITION_MODEL_ROOT=${FACE_RECOGNITION_MODEL_ROOT}
      - FACE_RECOGNITION_MODEL_NAME=${FACE_RECOGNITION_MODEL_NAME}
      - FACE_RECOGNITION_INDEX_DIR=${FACE_RECOGNITION_INDEX_DIR}
      - FACE_RECOGNITION_STRICT_LOCAL_MODELS=${FACE_RECOGNITION_STRICT_LOCAL_MODELS}
    volumes:
      # Map NAS mount point directly
      - ${HOST_MUSEUM_PATH}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: meam-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: meam-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - cantaloupe

  db:
    image: postgres:16-alpine
    container_name: meam-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      # Use local SSD for DB performance as requested
      # 按照要求使用本地 SSD 提升 DB 性能
      - ./db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Search engine for unified resource search
  # 统一资源目录检索引擎
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: meam-meili
    restart: always
    expose:
      - "7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-mdams_search_key}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # IIIF Server for high-resolution image serving
  # 用于高分辨率图像服务的 IIIF 服务器
  cantaloupe:
    # Build locally to avoid docker hub issues
    # 本地构建以避免 Docker Hub 问题
    build: ./cantaloupe
    image: meam-cantaloupe:local
    container_name: meam-cantaloupe
    restart: always
    expose:
      - "8182"
    volumes:
      # Read images directly from NAS
      - ${HOST_MUSEUM_PATH}:/var/lib/cantaloupe/images
      - ./cantaloupe.properties:/etc/cantaloupe.properties
      # Pass host entropy to container
      - /dev/urandom:/dev/random:ro
    environment:
      - CANTALOUPE_CONFIG=/etc/cantaloupe.properties
      # Java Heap constraint for N100 (16GB total, leave room for others)
      # Add java.security.egd to fix slow startup due to entropy pool issues
      - JAVA_OPTS=${JAVA_OPTS}
      # Ensure UTF-8 support for filenames
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/iiif/2/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  meam_pg_data:
